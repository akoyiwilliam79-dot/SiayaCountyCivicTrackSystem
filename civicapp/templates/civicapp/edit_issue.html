{% extends 'civicapp/base.html' %}

{% block content %}

<style>

.page-wrapper {
    padding: 20px;
    display: flex;
    justify-content: center;
}

.form-container {
    width: 100%;
    max-width: 700px;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.1);
}

/* Title */
h2 {
    text-align: center;
    color: #1f4e79;
    margin-bottom: 20px;
}

/* Form elements */
form p {
    margin-bottom: 15px;
}

input, textarea, select {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    outline: none;
    box-sizing: border-box;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #1f4e79;
    box-shadow: 0 0 5px rgba(31, 78, 121, 0.3);
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    background: #1f4e79;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #163a5a;
}

/* 📱 MOBILE FIXES */
@media (max-width: 600px) {

    .form-container {
        padding: 18px;
        border-radius: 8px;
    }

    h2 {
        font-size: 20px;
    }

    button {
        font-size: 15px;
        padding: 10px;
    }
}

</style>

<div class="page-wrapper">

<div class="form-container">

<h2>Edit Issue</h2>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Save Changes
    </button>
</form>

</div>

</div>

{% endblock %}
